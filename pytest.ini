[pytest]
pythonpath =
    src
# Keep optional R/rpy2 conftest imports out of default collection.
# Run them explicitly with: python -m pytest tests/reference
testpaths =
    tests/unit
    tests/integration
    tests/quality
markers =
    unit: fast tests for isolated Python behavior
    integration: tests spanning package components or bundled resources
    quality: source-tree documentation and structural convention checks
    reference: optional comparisons with external R implementations
    slow: tests that commonly require more than ten seconds
filterwarnings =
    ignore::DeprecationWarning:patchworklib.*
    ignore:The 'generic' unit for NumPy timedelta is deprecated.*:DeprecationWarning:mizani\._datetime\.utils
